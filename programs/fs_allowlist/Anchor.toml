[toolchain]
package_manager = "npm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
fs_allowlist = "3gfXWxgHN8tjJzxXGeAEiZWaixDe7ZMxXQGnpvHkQZu7"

[programs.devnet]
fs_allowlist = "3gfXWxgHN8tjJzxXGeAEiZWaixDe7ZMxXQGnpvHkQZu7"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "NODE_OPTIONS=--no-experimental-strip-types npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
startup_wait = 20000

[test.validator]
rpc_port = 8999
